name: Regional Sales Analytics Validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Analytical, publication, and generation quality gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate repository contract
        run: python tools/validate_repo.py

      - name: Run privacy and publication scan
        run: python tools/privacy_scan.py

      - name: Run analytical and source regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Verify generated offline frontend
        run: |
          node tools/prepare_app.mjs
          git diff --exit-code -- app/index.html app/generation-manifest.json
