name: Validate portfolio repository

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate repository
        run: python tools/validate_repo.py

      - name: Privacy scan
        run: python tools/privacy_scan.py

      - name: Analytics and publication tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Verify generated desktop frontend
        run: |
          node tools/prepare_app.mjs
          git diff --exit-code -- app/index.html app/generation-manifest.json
