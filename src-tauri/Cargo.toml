[package]
name = "regional-sales-analytics"
version = "1.0.0"
description = "Regional Sales Analytics Portfolio"
authors = ["Repository Author"]
edition = "2021"

[lib]
name = "regional_sales_analytics_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
